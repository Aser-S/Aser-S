name: Update profile card

on:
  schedule:
    - cron: "5 0 * * *"   # daily, keeps the uptime (age) ticking
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look up latest IDE versions
        run: |
          echo "VSCODE_VERSION=$(curl -fsSL https://api.github.com/repos/microsoft/vscode/releases/latest | jq -r .tag_name)" >> "$GITHUB_ENV"
          echo "PYCHARM_VERSION=$(curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=PCP&latest=true&type=release' | jq -r '.PCP[0].version')" >> "$GITHUB_ENV"

      - name: Regenerate card
        run: python scripts/card.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Update profile card"
            git push
          fi
